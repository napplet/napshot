<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Napshot capture fonts. The slim image ships Liberation and Noto Color Emoji only; without
  explicit aliases fontconfig resolves generic and platform families to Liberation Mono, so
  every napplet rendered in monospace. Map the usual web font stacks onto the installed faces.
-->
<fontconfig>
  <alias binding="same"><family>sans-serif</family><prefer><family>Liberation Sans</family><family>Noto Color Emoji</family></prefer></alias>
  <alias binding="same"><family>serif</family><prefer><family>Liberation Serif</family><family>Noto Color Emoji</family></prefer></alias>
  <alias binding="same"><family>monospace</family><prefer><family>Liberation Mono</family><family>Noto Color Emoji</family></prefer></alias>
  <alias binding="same"><family>system-ui</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias binding="same"><family>ui-sans-serif</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias binding="same"><family>-apple-system</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias binding="same"><family>BlinkMacSystemFont</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias binding="same"><family>Segoe UI</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias binding="same"><family>Roboto</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias binding="same"><family>Inter</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias binding="same"><family>Helvetica Neue</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias binding="same"><family>Helvetica</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias binding="same"><family>Arial</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias binding="same"><family>ui-serif</family><prefer><family>Liberation Serif</family></prefer></alias>
  <alias binding="same"><family>Georgia</family><prefer><family>Liberation Serif</family></prefer></alias>
  <alias binding="same"><family>Times New Roman</family><prefer><family>Liberation Serif</family></prefer></alias>
  <alias binding="same"><family>ui-monospace</family><prefer><family>Liberation Mono</family></prefer></alias>
  <alias binding="same"><family>SF Mono</family><prefer><family>Liberation Mono</family></prefer></alias>
  <alias binding="same"><family>Menlo</family><prefer><family>Liberation Mono</family></prefer></alias>
  <alias binding="same"><family>Consolas</family><prefer><family>Liberation Mono</family></prefer></alias>
  <alias binding="same"><family>Courier New</family><prefer><family>Liberation Mono</family></prefer></alias>
</fontconfig>
