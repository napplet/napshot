services:
  napshot:
    build: .
    restart: unless-stopped
    init: true
    shm_size: 512mb
    mem_limit: 2g
    cpus: 2
    stop_grace_period: 300s
    environment:
      # Set false in Coolify once the three required worker settings are filled in.
      NAPSHOT_SITE_ONLY: ${NAPSHOT_SITE_ONLY:-true}
      NAPSHOT_SECRET_KEY: ${NAPSHOT_SECRET_KEY:-}
      NAPSHOT_RELAYS: ${NAPSHOT_RELAYS:-}
      NAPSHOT_PROFILE: ${NAPSHOT_PROFILE:-}
      NAPSHOT_BLOSSOM_SERVERS: ${NAPSHOT_BLOSSOM_SERVERS:-}
      NAPSHOT_TRUSTED_AUTHORS: ${NAPSHOT_TRUSTED_AUTHORS:-}
      NAPSHOT_MIN_REPLICAS: ${NAPSHOT_MIN_REPLICAS:-2}
      NAPSHOT_HOST: 0.0.0.0
      NAPSHOT_PORT: 3080
      NAPSHOT_DATA_DIR: /app/data
      NAPSHOT_CHROMIUM: /usr/bin/chromium
      NAPSHOT_POLL_MS: ${NAPSHOT_POLL_MS:-30000}
      NAPSHOT_LOOKBACK_SECONDS: ${NAPSHOT_LOOKBACK_SECONDS:-86400}
    expose:
      - "3080"
    volumes:
      - napshot-data:/app/data
    security_opt:
      - no-new-privileges:true
      # Playwright's Docker profile permits Chromium's user namespace sandbox.
      - seccomp=./deploy/chromium-seccomp.json
    healthcheck:
      # Container liveness; /healthz separately reports worker scan readiness.
      test: ["CMD", "deno", "eval", "const r = await fetch('http://127.0.0.1:3080/'); Deno.exit(r.ok ? 0 : 1)"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

volumes:
  napshot-data:
    # Coolify namespaces this volume by application UUID across redeploys.
